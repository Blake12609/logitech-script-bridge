name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: LogitechScriptBridge
          path: |
            build/Release/LogitechScriptBridge.exe
            examples/*.lua
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item build/Release/LogitechScriptBridge.exe, README.md, LICENSE pkg/
          Copy-Item -Recurse examples, firmware pkg/
          Compress-Archive -Path pkg/* -DestinationPath "LogitechScriptBridge-${{ github.ref_name }}.zip"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/Release/LogitechScriptBridge.exe
            LogitechScriptBridge-${{ github.ref_name }}.zip

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build -j && ctest --test-dir build --output-on-failure
