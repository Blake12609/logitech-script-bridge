name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to create, e.g. v1.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # set for tag pushes and for manual runs that ask for a release
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: x86
            platform: Win32
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Rename exe
        shell: pwsh
        run: Copy-Item build/Release/LogitechScriptBridge.exe "LogitechScriptBridge-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: LogitechScriptBridge-${{ matrix.arch }}
          path: LogitechScriptBridge-${{ matrix.arch }}.exe

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build -j && ctest --test-dir build --output-on-failure

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # an optional signing key from the repo's secrets replaces app/release.jks
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          else
            unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          fi
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../LogitechScriptBridge-android.apk
      - name: Check APK
        run: |
          # the engine for every ABI, the JNI entry points, and the Kotlin methods C++ calls by name
          unzip -l LogitechScriptBridge-android.apk | tee apk.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do grep -q "lib/$abi/libscriptbridge.so" apk.txt; done
          unzip -o -q LogitechScriptBridge-android.apk 'lib/arm64-v8a/*' -d apk
          syms=$("$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D --defined-only apk/lib/arm64-v8a/libscriptbridge.so)
          for f in JNI_OnLoad NativeBridge_start NativeBridge_stop NativeBridge_onSerialData NativeBridge_checkSyntax; do
            echo "$syms" | grep -q "$f" || { echo "missing $f"; exit 1; }
          done
          map=android/app/build/outputs/mapping/release/mapping.txt
          grep -q "^io.github.blake12609.scriptbridge.NativeBridge -> io.github.blake12609.scriptbridge.NativeBridge:" $map
          for m in onWrite onLog onClearLog; do grep -Eq "$m\((byte\[\])?\)[0-9:]* -> $m$" $map || { echo "R8 renamed $m"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: LogitechScriptBridge-android
          path: LogitechScriptBridge-android.apk

  release:
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') }}
    needs: [windows, linux-tests, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LogitechScriptBridge-*
          merge-multiple: true
      - name: Package
        run: |
          mkdir -p "pkg/LogitechScriptBridge" "pkg/LogitechScriptBridge/scripts" "pkg/LogitechScriptBridge/configs"
          cp LogitechScriptBridge-x64.exe LogitechScriptBridge-x86.exe README.md LICENSE pkg/LogitechScriptBridge/
          cp -r examples firmware pkg/LogitechScriptBridge/
          cd pkg && zip -r "../LogitechScriptBridge-${VERSION}.zip" LogitechScriptBridge
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            LogitechScriptBridge-x64.exe
            LogitechScriptBridge-x86.exe
            LogitechScriptBridge-android.apk
            LogitechScriptBridge-${{ env.VERSION }}.zip
