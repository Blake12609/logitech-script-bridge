name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to create, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # set for tag pushes and for manual runs that ask for a release
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: LogitechScriptBridge
          path: |
            build/Release/LogitechScriptBridge.exe
            examples/*.lua
      - name: Package
        if: env.VERSION != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item build/Release/LogitechScriptBridge.exe, README.md, LICENSE pkg/
          Copy-Item -Recurse examples, firmware pkg/
          Compress-Archive -Path pkg/* -DestinationPath "LogitechScriptBridge-$env:VERSION.zip"
      - name: Release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/Release/LogitechScriptBridge.exe
            LogitechScriptBridge-${{ env.VERSION }}.zip

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build -j && ctest --test-dir build --output-on-failure
